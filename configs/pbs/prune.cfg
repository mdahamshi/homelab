# /etc/proxmox-backup/prune.cfg — sanitized (no secrets)
# Daily prune job on pbs-vms. No custom keep-* values are set in the job;
# effective retention (~23 nightly snapshots per guest) is driven by the
# backup job retention on pve.l.
prune: default-pbs-vms-235250fe-d714-4a
	schedule 14:00
	store pbs-vms
