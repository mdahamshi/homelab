################################
# Sanoid snapshot policy
# Managed by sanoid cron (runs every 15 min)
# Pool/dataset names redacted to generic placeholders
################################

# Templates
################################

[template_backup_light]
frequently = 0
daily = 0
hourly = 0
weekly = 1
monthly = 5
yearly = 1
autosnap = yes
autoprune = yes

[template_once]
frequently = 0
daily = 0
hourly = 0
weekly = 0
monthly = 0
yearly = 1
autosnap = yes
autoprune = yes

# Applied to the shared data tree (recursive)
################################
[zpool_home/data]
use_template = template_backup_light
frequently = 0
hourly = 0
daily  = 0
weekly = 1
monthly= 5
yearly = 1
autosnap = yes
autoprune = yes
recursive = yes

# Large media tree: skip periodic snapshots
[zpool_home/data/videos/movies]
autosnap = no
autoprune = no
