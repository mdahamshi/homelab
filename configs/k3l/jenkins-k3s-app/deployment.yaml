# jenkins-k3s-app — Deployment (namespace: default)
# Experiment: Jenkins pipeline builds an image and deploys it straight to this k3s cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-k3s-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-k3s-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: jenkins-k3s-app
    spec:
      containers:
      - name: app
        image: ghcr.io/example-user/jenkins-k3s-pipeline:42
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        resources: {}
      restartPolicy: Always
