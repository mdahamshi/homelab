# top-members — server Deployment (Node API + Postgres)
# Env: PORT/API_VERSION from ConfigMap; credentials from Secret top-members-secrets
# (not committed — see notes.md). Image tag :5 (staging) vs :15 (prod).
# Init container waits for postgres to be ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until pg_isready -h postgres -U \"$(POSTGRES_USER)\"; do echo waiting for postgres; sleep 2; done"]
        envFrom:
        - secretRef:
            name: top-members-secrets
      containers:
      - name: server
        image: ghcr.io/example-user/top-members-server:5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: top-members-config
              key: PORT
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: top-members-config
              key: API_VERSION
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: top-members-secrets
              key: DATABASE_URL
        - name: MEMBERSHIP_PASSCODE
          valueFrom:
            secretKeyRef:
              name: top-members-secrets
              key: MEMBERSHIP_PASSCODE
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: top-members-secrets
              key: SESSION_SECRET
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 30
        resources: {}
      restartPolicy: Always
