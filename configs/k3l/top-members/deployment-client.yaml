# top-members — client Deployment (nginx serving the SPA)
# Image tag differs per namespace: staging uses :5, prod uses :15 (sanitized owner).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: nginx
        image: ghcr.io/example-user/top-members-client:5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources: {}
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      restartPolicy: Always
---
